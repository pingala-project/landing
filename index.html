<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pingala is an open, source-backed learning project for AI and machine learning." />
    <title>Pingala — Learn clearly. Build boldly.</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b1020; color: #f4f6ff; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 10%, #273c87 0, transparent 42%), #0b1020; }
      main { max-width: 960px; margin: 0 auto; padding: 8rem 1.5rem; }
      .eyebrow { color: #a9baff; letter-spacing: .14em; text-transform: uppercase; font-size: .78rem; font-weight: 700; }
      h1 { max-width: 720px; margin: 1rem 0; font-size: clamp(3rem, 9vw, 6.5rem); line-height: .95; letter-spacing: -.06em; }
      p { max-width: 620px; color: #c4cbea; font-size: 1.2rem; line-height: 1.65; }
      .actions { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 2rem; }
      a { display: inline-block; border: 1px solid #6878c5; border-radius: 999px; padding: .8rem 1.15rem; color: #fff; text-decoration: none; }
      a.primary { background: #f2c14e; border-color: #f2c14e; color: #17120a; font-weight: 700; }
      footer { margin-top: 7rem; color: #8d96b8; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Open curriculum · Human reviewed</div>
      <h1>Learn clearly. Build boldly.</h1>
      <p>Pingala makes technical learning approachable with source-backed lessons, transparent contribution history, and a curriculum anyone can help improve.</p>
      <div class="actions">
        <a class="primary" href="https://pingala-project.github.io/dashboard/">Open the dashboard</a>
        <a href="https://github.com/pingala-project/ai-ml">Explore the curriculum</a>
      </div>
      <footer>Built in public by the Pingala community.</footer>
    </main>
  </body>
</html>
